<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kitchen Login — NusaRasa</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link href="../assets/css/kitchen.css" rel="stylesheet">

  <style>
    body.kitchen-login {
      background: linear-gradient(135deg, #fff4ef, #ffeccc, #fff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
    }

    .login-card {
      border-radius: 16px;
      border: 1px solid #eee;
      background: #ffffffcc;
      backdrop-filter: blur(4px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.06);
      transition: 0.25s;
    }

    .login-card:hover {
      box-shadow: 0 10px 24px rgba(0,0,0,0.10);
    }

    .login-title {
      font-weight: 700;
      color: var(--pepper);
      letter-spacing: .5px;
    }

    .form-control {
      border-radius: 10px;
      padding: 10px 12px;
      border: 1px solid #ddd;
      transition: .2s;
    }

    .form-control:focus {
      border-color: var(--pepper);
      box-shadow: 0 0 0 0.15rem rgba(184,59,36,0.15);
    }

    .btn-pepper {
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      padding: 10px;
      transition: .25s;
    }

    .btn-pepper:hover {
      filter: brightness(1.1);
    }
  </style>
</head>

<body class="kitchen-login">

  <main class="container d-flex align-items-center justify-content-center">
    <div class="card p-4 login-card w-100" style="max-width:420px;">
      <h4 class="mb-3 text-center login-title">Kitchen Login</h4>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input id="kuser" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input id="kpass" type="password" class="form-control" required>
        </div>

        <div class="d-grid">
          <button class="btn btn-pepper">Login</button>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('kuser').value.trim();
      const p = document.getElementById('kpass').value.trim();
      const res = await fetch('../backend/login.php', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:u,password:p})
      });
      const j = await res.json();
      if (j.ok) {
        localStorage.setItem('kitchen_token', j.token);
        location.href = 'kitchen-dashboard.html';
      } else {
        Swal.fire('Gagal', j.msg || 'Login error', 'error');
      }
    });
  </script>

</body>
</html>
