<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kitchen Dashboard — NusaRasa</title>

  <link href="../assets/css/kitchen.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body style="background:#f5f6f8;">
  <div class="d-flex">

    <!-- SIDEBAR -->
    <nav class="sidebar">
      <div class="brand">NusaRasa Kitchen</div>
      <ul>
        <li><a href="dashboard.html" class="active">Dashboard</a></li>
        <li><a href="orders.html">Orders</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="stock.html">Stock</a></li>
        <li><a href="sales.html">Sales</a></li>
        <li><a href="#" id="logoutBtn" class="logout-btn">Logout</a></li>
      </ul>
    </nav>

    <!-- MAIN -->
    <main class="main p-4">

      <h3 class="page-title mb-3">Dashboard</h3>

      <!-- WIDGET AREA -->
      <div class="row g-4">
        <div class="col-md-4">
          <div class="card dashboard-card p-3">
            <small class="text-muted">Today's Sales</small>
            <h4 id="todaySales" class="fw-bold mt-1">Rp0</h4>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card dashboard-card p-3">
            <small class="text-muted">Top Menu (30d)</small>
            <ul id="topMenu" class="list-unstyled mt-2 mb-0"></ul>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card dashboard-card p-3">
            <small class="text-muted">Low Stock</small>
            <ul id="lowStock" class="list-unstyled mt-2 mb-0"></ul>
          </div>
        </div>
      </div>

      <h5 class="section-title mt-5">Recent Orders</h5>
      <div id="recentOrders" class="list-group rounded bg-white shadow-sm" style="min-height:60px;"></div>
    </main>

  </div>

  <script src="../assets/js/kitchen.js"></script>
</body>
</html>
